<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Camera &amp; microphone access</title>
  <link rel="stylesheet" href="permission.css" />
</head>
<body>
  <div class="box">
    <div class="logo-dot"></div>
    <h1 id="title">Allow camera &amp; microphone</h1>

  </div>
  <script src="permission.js"></script>
</body>
</html>
